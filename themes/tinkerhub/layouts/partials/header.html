<header class="header">
    <div class="branding">
        <a class="logo" href="{{ .Site.BaseURL }}" aria-label="Home">
            <img src="{{ "logo.png" | absURL }}" alt="TinkerHub Learning Paths">
        </a>
    </div>
    <div class="search">
        <label for="search-input" class="visually-hidden">Search learning paths</label>
        <input type="text" id="search-input" placeholder="Search" />
    </div>
    <nav>
        <a class="button" id="create-btn" href="{{ "/admin" | absURL }}" aria-label="Add new Learning Path" style="display:none">
            <i data-lucide="plus-circle" aria-hidden="true"></i>
        </a>
        <a class="button" href="https://github.com/tinkerhub/TinkerHub-Learning-Paths" aria-label="View on GitHub">
            <i data-lucide="github" aria-hidden="true"></i>
        </a>
        <a class="button auth-button" href="#" id="auth-btn" aria-label="Login to track progress" title="Login to track progress">
            <i data-lucide="log-in" aria-hidden="true"></i>
        </a>
    </nav>
</header>
